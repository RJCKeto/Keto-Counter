backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "index.html" # Targets your main page directly
        label: "Home Page Tracker"
        name: "home"
        fields:
          - { label: "Current Weight (kg/lbs)", name: "current_weight", widget: "string" }
          - { label: "Next Milestone Goal", name: "next_milestone", widget: "string" }
          - { label: "Main Page Content Text", name: "body", widget: "markdown" }
